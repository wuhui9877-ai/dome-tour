# Project-wide Gradle settings.
# Mirrors the official PICO Spatial UI sample, with a worker cap for small VMs.
# org.gradle.jvmargs DISABLED on this VM: the sandbox intercepts all TCP
# connections from Java processes (it injects a policy message into the
# stream), which breaks Gradle daemon IPC. Heap cap is enforced via
# GRADLE_OPTS + --no-daemon instead; see README.md.
#org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kotlin must compile in-process on this VM: the Kotlin compile daemon talks
# over loopback TCP, which the sandbox intercepts (same cause as above).
kotlin.compiler.execution.strategy=in-process
